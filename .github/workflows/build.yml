name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    # The installer emits paths and rewrites separators, so it is checked on both
    # families. A Windows-only path bug would otherwise reach users first.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        working-directory: installer
        run: npm ci

      - name: Type-check and test
        working-directory: installer
        run: npm test

      - name: Smoke-test a real install
        working-directory: installer
        shell: bash
        run: |
          set -euo pipefail
          for ide in antigravity cursor; do
            target="$(mktemp -d)"
            node dist/cli.js init --ide "$ide" --stack java-spring --dir "$target" > /dev/null
            test -f "$target/.code-forge.json"
            node dist/cli.js update --dir "$target" > /dev/null
            echo "$ide install and update: ok"
          done
